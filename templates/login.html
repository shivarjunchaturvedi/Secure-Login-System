<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Sign in · Secure Login System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --ink:#152238; --muted:#69778d; --accent:#2563eb; }
    body { min-height:100vh; margin:0; display:grid; place-items:center; padding:24px; background:radial-gradient(ellipse at top left,#e0eaff 0,transparent 45%),linear-gradient(135deg,#f7f9ff,#eef2f8); color:var(--ink); font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif; }
    .auth-card { width:min(100%,430px); background:#fff; padding:clamp(26px,5vw,42px); border:1px solid #e5eaf2; border-radius:24px; box-shadow:0 24px 70px #17255416; }
    .brand-icon { width:58px;height:58px;border-radius:18px;display:grid;place-items:center;margin:0 auto 18px;background:#eaf1ff;font-size:28px; }
    .form-control { padding:12px 14px;border-radius:12px;border-color:#d8e0ed; }
    .form-control:focus { border-color:#7ea5ff;box-shadow:0 0 0 .22rem #2563eb20; }
    .btn-primary { padding:12px;border-radius:12px;background:var(--accent);font-weight:650; }
    .muted { color:var(--muted); }
  </style>
</head>
<body>
  <main class="auth-card">
    <div class="brand-icon" aria-hidden="true">🔐</div>
    <h1 class="h3 text-center fw-bold mb-2">Welcome back</h1>
    <p class="text-center muted mb-4">Sign in to your secure account</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}<div class="alert alert-{{ category }} py-2" role="alert">{{ message }}</div>{% endfor %}
    {% endwith %}
    <form method="post" action="{{ url_for('login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label for="username" class="form-label fw-semibold">Username</label>
        <input id="username" name="username" type="text" class="form-control" autocomplete="username" minlength="3" maxlength="30" placeholder="Enter your username" required autofocus>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label fw-semibold">Password</label>
        <input id="password" name="password" type="password" class="form-control" autocomplete="current-password" maxlength="72" placeholder="Enter your password" required>
      </div>
      <div class="form-check mb-4">
        <input id="show-password" class="form-check-input" type="checkbox">
        <label for="show-password" class="form-check-label muted">Show password</label>
      </div>
      <button type="submit" class="btn btn-primary w-100">Sign in securely</button>
    </form>
    <p class="text-center muted mt-4 mb-0">New here? <a href="{{ url_for('register') }}" class="fw-semibold text-decoration-none">Create an account</a></p>
    <p class="text-center small muted mt-4 mb-0">Your password is never stored as plain text.</p>
  </main>
  <script>
    const passwordInput = document.getElementById("password");
    document.getElementById("show-password").addEventListener("change", event => {
      passwordInput.type = event.target.checked ? "text" : "password";
    });
  </script>
</body>
</html>
